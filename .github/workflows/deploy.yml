name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Revisar configuración de Supabase
        run: |
          # Los secretos/variables del repositorio tienen prioridad; si no existen se usa .env.production
          [ -n "$VITE_SUPABASE_URL" ] && echo "VITE_SUPABASE_URL: secreto del repositorio" || echo "VITE_SUPABASE_URL: se usa .env.production"
          [ -n "$VITE_SUPABASE_ANON_KEY" ] && echo "VITE_SUPABASE_ANON_KEY: secreto del repositorio" || echo "VITE_SUPABASE_ANON_KEY: se usa .env.production"
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || vars.VITE_SUPABASE_ANON_KEY }}
      - name: Compilar
        # una variable vacía anularía .env.production, por eso se elimina si no tiene valor
        run: |
          [ -z "$VITE_SUPABASE_URL" ] && unset VITE_SUPABASE_URL
          [ -z "$VITE_SUPABASE_ANON_KEY" ] && unset VITE_SUPABASE_ANON_KEY
          npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || vars.VITE_SUPABASE_ANON_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
